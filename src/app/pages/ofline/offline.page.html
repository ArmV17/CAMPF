<ion-content class="fondo-claro ion-padding">
  <div class="contenedor-centrado animated fadeIn">
    <div class="tarjeta-error-moderna">
      
      <!-- Icono superior con efecto glow -->
      <div class="contenedor-icono-error">
        <ion-icon name="cloud-offline-outline"></ion-icon>
      </div>

      <!-- Textos informativos -->
      <h1 class="titulo-error">Sin Conexión a Internet</h1>
      <p class="descripcion-error">
        Parece que has perdido la conexión de red. Por favor, verifica tu Wi-Fi o datos móviles para continuar operando la Aplicación.
      </p>

      <!-- Botón de reintento estilizado -->
      <ion-button expand="block" class="boton-reintentar" (click)="reintentarConexion()">
        <ion-icon name="refresh-outline" slot="start"></ion-icon>
        Volver a Intentar
      </ion-button>

    </div>
  </div>
</ion-content>
