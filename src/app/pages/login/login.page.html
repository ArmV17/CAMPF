<ion-content [fullscreen]="true" class="background-login">
  
  <img src="assets/icon/Logo.png" alt="Logo" class="logo-esquina" />

  <div class="login-wrapper">
    
    <div class="header-section ion-text-center">
      <div class="logo-circle">
        <ion-icon name="business-outline"></ion-icon>
      </div>
      <h1 class="app-name">CAMPF</h1>
      <p class="app-subtitle">Control de Almacén y Préstamos</p>
    </div>

    <ion-card class="login-card ion-no-margin">
      <ion-card-content>
        <div class="form-container">
          
          <ion-item lines="none" class="input-item">
            <ion-icon name="person-outline" slot="start"></ion-icon>
            <ion-input 
              #inputEmpleado 
              label="Número de Empleado" 
              labelPlacement="floating" 
              type="text" 
              [(ngModel)]="numEmpleado"
              placeholder="Ej. 8125"
              autofocus="true" 
              (keyup.enter)="focusPassword()">
            </ion-input>
          </ion-item>

          <ion-item lines="none" class="input-item ion-margin-top">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input 
              #inputPassword 
              label="Contraseña" 
              labelPlacement="floating" 
              type="password" 
              [(ngModel)]="password"
              placeholder="••••••••"
              (keyup.enter)="entrar()">
            </ion-input>
          </ion-item>

          <ion-button 
            expand="block" 
            shape="round" 
            class="btn-login ion-margin-top" 
            (click)="entrar()">
            INGRESAR
            <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
          </ion-button>

        </div>
      </ion-card-content>
    </ion-card>

    <div class="footer-info ion-text-center">
      <p>Departamento de Forestasl - UAAAN</p>
    </div>

  </div>
</ion-content>
